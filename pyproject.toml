[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "n44"
version = "0.1.0.dev0"
description = "Load flow, N-1 security, OPF and redispatch on the Nordic 44 equivalent for every hour of 2015"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcelo Escalante" }]
dependencies = [
    "pandapower==3.5.6",
    "numpy>=2.0,<2.5",
    "pandas>=2.3,<3",
    "scipy>=1.15",
    "networkx>=3.6",
    "pyarrow>=20",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]
speed = ["numba>=0.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["n44", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "dataset: needs the full Zenodo dataset under data/raw (skipped when absent)",
]
